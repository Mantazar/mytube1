<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>MyTube</title>
<style>
:root{--bg:#fff;--tx:#0f0f0f;--mu:#606060;--line:#e6e6e6;--chip:#f1f1f1;--ac:#1a6ef0;--onac:#fff;--bad:#d93025;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--tx:#f1f1f1;--mu:#9a9a9a;--line:#2b2b2b;--chip:#242424;--ac:#6aa9ff;--onac:#0b1b33;--bad:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:52px;padding:0 6px;background:var(--bg)}
h1{margin:0 10px;font-size:19px;font-weight:700;flex:1}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer}
.ib:active{background:var(--chip)}
.ib svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#status{padding:2px 14px 8px;color:var(--mu);font-size:13px;min-height:24px}
#status.err{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:22px;padding:0 0 24px}
@media (min-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:24px 14px;padding:0 14px 24px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:700px){.thumb{border-radius:12px;overflow:hidden}}
.dur{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.8);color:#fff;padding:1px 5px;border-radius:4px;font-size:12px;font-weight:600}
.meta{display:flex;gap:10px;padding:10px 12px 0}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--chip);flex:none}
.txt{min-width:0}
.t{font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{color:var(--mu);font-size:12.5px;margin-top:3px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:56px 24px;line-height:1.9;white-space:pre-line}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.panel{width:100%;max-height:85vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.ph{display:flex;align-items:center;margin-bottom:8px}
.ph h2{margin:0;font-size:17px;flex:1}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--chip);border:0;border-radius:10px;padding:12px;outline:none}
input:focus{box-shadow:0 0 0 2px var(--ac)}
.pbtn{border:0;background:var(--ac);color:var(--onac);font-weight:600;padding:0 18px;border-radius:10px;cursor:pointer}
#msg{min-height:22px;margin:8px 0;font-size:13.5px;color:var(--mu)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ch .av{width:34px;height:34px}
.ch span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{background:transparent;color:var(--bad);border:0;padding:6px 4px;cursor:pointer}
#player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#pbar{display:flex;align-items:center;height:52px;padding:0 6px}
#pmedia{width:100%;aspect-ratio:16/9;max-height:56vh;background:#000}
#vid{width:100%;height:100%;display:block;background:#000}
#pinfo{padding:12px 14px;overflow:auto}
#ptitle{font-weight:600;line-height:1.5;font-size:16px}
#perr{color:var(--mu);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>MyTube</h1>
  <button class="ib" id="refresh" aria-label="تحديث" title="تحديث">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="ib" id="open" aria-label="القنوات" title="القنوات">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
</header>
<div id="status"></div>
<main id="feed" class="grid"></main>

<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <div class="ph">
      <h2>القنوات</h2>
      <button class="ib" id="close" aria-label="إغلاق" title="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="row">
      <input id="in" placeholder="الصق رابط القناة أو @اسمها أو UC..." inputmode="url" autocomplete="off">
      <button class="pbtn" id="addbtn">إضافة</button>
    </div>
    <div id="msg"></div>
    <div id="list"></div>
  </div>
</div>

<div id="player" hidden>
  <div id="pbar">
    <button class="ib" id="pclose" aria-label="إغلاق المشغل" title="إغلاق">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="pmedia"><video id="vid" controls playsinline></video></div>
  <div id="pinfo"><div id="ptitle"></div><div id="perr"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
let channels = store.get('mytube.channels', []);

/* ============================================================
   المصادر: Piped (أساسي) + Invidious (بديل) — كلاهما بدون إعلانات
   ============================================================ */
const PIPED = [
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.adminforge.de',
  'https://api.piped.private.coffee',
  'https://pipedapi.leptons.xyz',
  'https://pipedapi.drgns.space',
  'https://pipedapi.ducks.party',
  'https://pipedapi.nosebs.ru',
  'https://piped-api.lunar.icu',
  'https://pipedapi.reallyaweso.me'
];

const INVIDIOUS = [
  'https://inv.nadeko.net',
  'https://yewtu.be',
  'https://invidious.nerdvpn.de',
  'https://iv.melmac.space',
  'https://invidious.f5.si',
  'https://inv.us.projectsegfau.lt',
  'https://invidious.privacydev.net'
];

let pipedGood = null;
let invGood = null;

function fetchT(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms || 7000);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
}

async function piped(path) {
  const order = pipedGood ? [pipedGood, ...PIPED.filter(p => p !== pipedGood)] : PIPED.slice();
  let lastErr;
  for (const base of order.slice(0, 6)) {
    try {
      const r = await fetchT(base + path, 7000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j && j.error) throw new Error(j.error);
      pipedGood = base;
      return j;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Piped غير متاح');
}

async function inv(path) {
  const order = invGood ? [invGood, ...INVIDIOUS.filter(p => p !== invGood)] : INVIDIOUS.slice();
  let lastErr;
  for (const base of order.slice(0, 5)) {
    try {
      const r = await fetchT(base + path, 7000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      invGood = base;
      return { base, data: j };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Invidious غير متاح');
}

/* ============================================================
   القناة: بيانات + فيديوهات (بصيغة موحّدة)
   ============================================================ */
async function getChannel(id) {
  // 1) Piped
  try {
    const c = await piped('/channel/' + id);
    const list = (c.relatedStreams || c.items || c.videos || []);
    const vids = list
      .filter(v => !v.isShort && typeof v.url === 'string' && v.url.includes('v='))
      .map(v => {
        const vid = v.url.split('v=')[1].split('&')[0];
        return {
          id: vid,
          title: v.title,
          thumb: v.thumbnail,
          dur: v.duration,
          t: v.uploaded,
          by: c.name || id,
          av: c.avatarUrl || ''
        };
      });
    return { name: c.name || id, avatar: c.avatarUrl || '', videos: vids };
  } catch (e) { /* ننتقل للبديل */ }

  // 2) Invidious
  const { base, data: c } = await inv('/api/v1/channels/' + id);
  const thumbs = c.authorThumbnails || [];
  let avatar = (thumbs[thumbs.length - 1] || {}).url || '';
  if (avatar.startsWith('/')) avatar = base + avatar;

  let videos = [];
  // latestVideos قد لا تحتوي على طابع زمني رقمي؛ نستخدمه فقط إن وجد
  if (Array.isArray(c.latestVideos) && c.latestVideos.length) {
    videos = c.latestVideos.map(v => ({
      id: v.videoId,
      title: v.title,
      thumb: (v.videoThumbnails || []).find(t => t.quality === 'medium')?.url
           || (v.videoThumbnails && v.videoThumbnails[0] && v.videoThumbnails[0].url) || '',
      dur: v.lengthSeconds,
      t: null,
      by: c.author || id,
      av: avatar
    }));
  } else {
    // endpoint بديل للفيديوهات
    try {
      const { data: vv } = await inv('/api/v1/channels/' + id + '/videos');
      const arr = (vv && vv.videos) || [];
      videos = arr.map(v => ({
        id: v.videoId,
        title: v.title,
        thumb: (v.videoThumbnails || []).find(t => t.quality === 'medium')?.url
             || (v.videoThumbnails && v.videoThumbnails[0] && v.videoThumbnails[0].url) || '',
        dur: v.lengthSeconds,
        t: (v.published || 0) * 1000 || null,
        by: c.author || id,
        av: avatar
      }));
    } catch (e2) {}
  }
  return { name: c.author || id, avatar, videos };
}

/* ============================================================
   البحث عن قناة (لإضافة جديدة)
   ============================================================ */
async function resolveChannel(input) {
  input = input.trim();
  const m = input.match(/UC[\w-]{22}/);
  let id = m && m[0];

  if (!id) {
    const h = input.match(/@([\w.\-]+)/);
    const q = h ? h[1] : input;

    // Piped search
    try {
      const res = await piped('/search?q=' + encodeURIComponent(q) + '&filter=channels');
      const first = (res.items || []).find(i => i.url && i.url.indexOf('/channel/') !== -1);
      if (first) id = first.url.split('/channel/')[1];
    } catch (e) {}

    // Invidious search
    if (!id) {
      const { data: res } = await inv('/api/v1/search?q=' + encodeURIComponent(q) + '&type=channel');
      const first = (res || [])[0];
      if (first && first.authorId) id = first.authorId;
    }
  }

  if (!id) throw new Error('ما لقيت القناة');

  // نجيب الاسم والصورة
  try {
    const c = await getChannel(id);
    return { id, name: c.name || id, avatar: c.avatar || '' };
  } catch (e) {
    return { id, name: id, avatar: '' };
  }
}

/* ============================================================
   أدوات مساعدة
   ============================================================ */
function ago(ms) {
  if (!ms || ms < 0) return '';
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 60) return 'قبل ' + Math.max(m, 1) + ' دقيقة';
  const h = Math.floor(m / 60);
  if (h < 24) return 'قبل ' + h + ' ساعة';
  const d = Math.floor(h / 24);
  if (d < 30) return 'قبل ' + d + ' يوم';
  const mo = Math.floor(d / 30);
  if (mo < 12) return 'قبل ' + mo + ' شهر';
  return 'قبل ' + Math.floor(mo / 12) + ' سنة';
}
function fmt(s) {
  if (!s || s < 0) return '';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? h + ':' + p(m) + ':' + p(x) : m + ':' + p(x);
}
async function pool(items, n, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: n }, async () => {
    while (i < items.length) {
      const k = i++;
      try { out[k] = { ok: true, v: await fn(items[k]) }; }
      catch (e) { out[k] = { ok: false, e }; }
    }
  }));
  return out;
}

/* ============================================================
   الفيد
   ============================================================ */
async function loadFeed() {
  const box = $('#feed');
  const statusEl = $('#status');
  box.textContent = '';
  statusEl.classList.remove('err');

  if (!channels.length) {
    box.appendChild(el('div', 'empty', 'ما عندك قنوات بعد.\nاضغط أيقونة القوائم فوق والصق رابط أي قناة.'));
    statusEl.textContent = '';
    return;
  }
  statusEl.textContent = 'جاري تحميل الفيديوهات…';

  const res = await pool(channels, 2, c => getChannel(c.id));
  let vids = [], fail = 0;
  res.forEach((r, i) => {
    if (!r.ok) { fail++; return; }
    r.v.videos.forEach(v => vids.push(v));
  });
  vids.sort((a, b) => (b.t || 0) - (a.t || 0));
  vids = vids.slice(0, 100);

  if (!vids.length) {
    statusEl.classList.add('err');
    statusEl.textContent = (fail === channels.length)
      ? 'فشل تحميل كل القنوات — كل سيرفرات Piped وInvidious لا تستجيب حالياً. جرّب بعد قليل أو اضغط تحديث.'
      : 'ما فيه فيديوهات ظاهرة لهذه القنوات.';
    return;
  }
  statusEl.textContent = vids.length + ' فيديو' + (fail ? ' — فشلت ' + fail + ' قناة (اضغط تحديث)' : '');

  vids.forEach(v => {
    const card = el('div', 'card');
    const th = el('div', 'thumb');
    const img = el('img');
    img.loading = 'lazy'; img.alt = ''; img.src = v.thumb || '';
    th.appendChild(img);
    if (v.dur > 0) th.appendChild(el('div', 'dur', fmt(v.dur)));
    const meta = el('div', 'meta');
    const av = el('img', 'av');
    av.alt = ''; av.src = v.av || '';
    const txt = el('div', 'txt');
    txt.appendChild(el('div', 't', v.title));
    txt.appendChild(el('div', 's', v.by + (v.t ? ' · ' + ago(v.t) : '')));
    meta.appendChild(av); meta.appendChild(txt);
    card.appendChild(th); card.appendChild(meta);
    card.onclick = () => play(v);
    box.appendChild(card);
  });
}

/* ============================================================
   المشغل — بدون إعلانات (Piped proxy ثم Invidious local)
   ============================================================ */
async function getStream(id) {
  // 1) Piped: نفضل proxyUrl دائماً
  try {
    const d = await piped('/streams/' + id);
    const all = (d.videoStreams || []).filter(s => !s.videoOnly);
    const proxied = all.filter(s => s.proxyUrl);
    const pool2 = proxied.length ? proxied : all.filter(s => s.url);
    if (pool2.length) {
      pool2.sort((a, b) => (parseInt(b.quality) || 0) - (parseInt(a.quality) || 0));
      const best = pool2[0];
      return {
        src: best.proxyUrl || best.url,
        quality: best.quality || 'auto',
        via: 'Piped'
      };
    }
  } catch (e) {}

  // 2) Invidious: local=true → يمر البث عبر سيرفر Invidious (بدون إعلانات)
  const { base, data: d } = await inv('/api/v1/videos/' + id + '?local=true');
  const fs = (d.formatStreams || []).filter(s => s.url);
  if (fs.length) {
    fs.sort((a, b) => (parseInt(b.resolution) || 0) - (parseInt(a.resolution) || 0));
    let url = fs[0].url;
    if (url.startsWith('/')) url = base + url;
    return { src: url, quality: fs[0].resolution || 'auto', via: 'Invidious' };
  }
  throw new Error('لا يوجد بث بدون إعلانات لهذا الفيديو');
}

async function play(v) {
  $('#player').hidden = false;
  $('#ptitle').textContent = v.title;
  const vid = $('#vid');
  vid.removeAttribute('src');
  $('#perr').textContent = 'جاري التحميل…';

  try {
    const s = await getStream(v.id);
    vid.src = s.src;
    vid.addEventListener('error', () => {
      $('#perr').textContent = 'تعذر التشغيل المباشر — جرّب تحديث الصفحة، أو الفيديو قد يمنع التضمين.';
    }, { once: true });
    try { await vid.play(); } catch (e) {}
    $('#perr').textContent = 'الجودة: ' + s.quality + ' — المصدر: ' + s.via + ' (بدون إعلانات)';
  } catch (e) {
    $('#perr').textContent = 'فشل التشغيل: ' + (e.message || e);
  }
}

function closePlayer() {
  const vid = $('#vid');
  try { vid.pause(); } catch (e) {}
  vid.removeAttribute('src');
  try { vid.load(); } catch (e) {}
  $('#player').hidden = true;
}

/* ============================================================
   القنوات (إضافة/حذف/عرض)
   ============================================================ */
function setMsg(t, isErr) {
  const m = $('#msg');
  m.textContent = t;
  m.style.color = isErr ? 'var(--bad)' : '';
}

function renderChannels() {
  const box = $('#list');
  box.textContent = '';
  if (!channels.length) {
    box.appendChild(el('div', 's', 'ما فيه قنوات مضافة.'));
    return;
  }
  channels.forEach(c => {
    const row = el('div', 'ch');
    const img = el('img', 'av'); img.alt = ''; img.src = c.avatar || '';
    const name = el('span', '', c.name);
    const del = el('button', 'del', 'حذف');
    del.onclick = () => {
      channels = channels.filter(x => x.id !== c.id);
      store.set('mytube.channels', channels);
      renderChannels();
      loadFeed();
    };
    row.appendChild(img); row.appendChild(name); row.appendChild(del);
    box.appendChild(row);
  });
}

async function addChannel() {
  const v = $('#in').value;
  if (!v.trim()) return;
  setMsg('جاري البحث…');
  try {
    const ch = await resolveChannel(v);
    if (channels.some(c => c.id === ch.id)) {
      setMsg('هذي القناة مضافة من قبل: ' + ch.name, true);
      return;
    }
    channels.push(ch);
    store.set('mytube.channels', channels);
    $('#in').value = '';
    setMsg('تمت إضافة: ' + ch.name);
    renderChannels();
    loadFeed();
  } catch (e) {
    setMsg('فشلت الإضافة: ' + (e.message || e) + ' — جرّب تلصق رابط القناة أو UC... مباشرة.', true);
  }
}

/* ============================================================
   ربط الأزرار
   ============================================================ */
$('#open').onclick = () => { $('#sheet').hidden = false; renderChannels(); };
$('#close').onclick = () => { $('#sheet').hidden = true; };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; };
$('#addbtn').onclick = addChannel;
$('#in').addEventListener('keydown', e => { if (e.key === 'Enter') addChannel(); });
$('#refresh').onclick = loadFeed;
$('#pclose').onclick = closePlayer;

loadFeed();
</script>
</body>
</html>
